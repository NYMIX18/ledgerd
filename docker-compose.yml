services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://ledger:ledger@db:5432/ledger
      API_KEY: change-me-dev-key
      MPESA_WEBHOOK_TOKEN: change-me-webhook-token
      WORKER_INTERVAL_MS: "500"
    ports: ["8080:8080"]

  dashboard:
    build: ./dashboard
    depends_on: [api]
    environment:
      LEDGERD_URL: http://api:8080
      LEDGERD_API_KEY: change-me-dev-key
    ports: ["3001:3001"]

volumes:
  pgdata:
