<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="ledgerd banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#16243f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <!-- Kenyan-flag accent: black / red / green stripes with white separators -->
  <rect x="0" y="0" width="1200" height="8" fill="#000000"/>
  <rect x="0" y="8" width="1200" height="2" fill="#ffffff"/>
  <rect x="0" y="10" width="1200" height="8" fill="#bb0000"/>
  <rect x="0" y="18" width="1200" height="2" fill="#ffffff"/>
  <rect x="0" y="20" width="1200" height="8" fill="#006600"/>

  <!-- ledger glyph -->
  <g transform="translate(80,92)">
    <rect width="150" height="170" rx="14" fill="#1d2f52" stroke="#4f7cff" stroke-width="3"/>
    <line x1="75" y1="22" x2="75" y2="116" stroke="#4f7cff" stroke-width="3"/>
    <line x1="18" y1="48" x2="132" y2="48" stroke="#4f7cff" stroke-width="3"/>
    <text x="37" y="38" font-family="Menlo,Consolas,monospace" font-size="16" fill="#9db8ff" text-anchor="middle">DR</text>
    <text x="113" y="38" font-family="Menlo,Consolas,monospace" font-size="16" fill="#9db8ff" text-anchor="middle">CR</text>
    <rect x="22" y="68" width="44" height="10" rx="3" fill="#6ee7a8"/>
    <rect x="22" y="90" width="30" height="10" rx="3" fill="#6ee7a8"/>
    <rect x="84" y="68" width="44" height="10" rx="3" fill="#ffb86b"/>
    <rect x="84" y="90" width="30" height="10" rx="3" fill="#ffb86b"/>
    <text x="75" y="136" font-family="Menlo,Consolas,monospace" font-size="15" fill="#ffffff" text-anchor="middle">&#916; = 0</text>
  </g>

  <text x="270" y="150" font-family="Helvetica,Arial,sans-serif" font-size="78" font-weight="700" fill="#ffffff">ledgerd</text>
  <text x="272" y="195" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#b9c6e4">A correctness-first double-entry ledger in Rust</text>

  <g font-family="Helvetica,Arial,sans-serif" font-size="19" font-weight="600">
    <rect x="272" y="226" width="196" height="40" rx="20" fill="#1f3b2f" stroke="#6ee7a8"/>
    <text x="370" y="252" fill="#6ee7a8" text-anchor="middle">double-entry</text>
    <rect x="482" y="226" width="226" height="40" rx="20" fill="#3b2f1f" stroke="#ffb86b"/>
    <text x="595" y="252" fill="#ffb86b" text-anchor="middle">idempotent writes</text>
    <rect x="722" y="226" width="226" height="40" rx="20" fill="#2a1f3b" stroke="#c4a1ff"/>
    <text x="835" y="252" fill="#c4a1ff" text-anchor="middle">M-Pesa callbacks</text>
    <rect x="962" y="226" width="170" height="40" rx="20" fill="#1f2f3b" stroke="#7cc8ff"/>
    <text x="1047" y="252" fill="#7cc8ff" text-anchor="middle">axum + sqlx</text>
  </g>
</svg>
