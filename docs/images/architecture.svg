<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1100" height="560" fill="#f8fafc"/>
  <text x="550" y="38" font-size="24" font-weight="700" fill="#0f172a" text-anchor="middle">ledgerd &#8212; system architecture</text>

  <!-- clients -->
  <rect x="30" y="100" width="190" height="80" rx="12" fill="#e0ecff" stroke="#3b6ee0" stroke-width="2"/>
  <text x="125" y="135" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">Your services</text>
  <text x="125" y="158" font-size="14" fill="#334155" text-anchor="middle">Bearer + Idempotency-Key</text>

  <rect x="30" y="300" width="190" height="80" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="125" y="335" font-size="17" font-weight="700" fill="#14532d" text-anchor="middle">Safaricom Daraja</text>
  <text x="125" y="358" font-size="14" fill="#334155" text-anchor="middle">STK push callbacks</text>

  <!-- API -->
  <rect x="320" y="70" width="330" height="360" rx="16" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="485" y="100" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">ledgerd (single Rust binary)</text>

  <rect x="345" y="120" width="280" height="64" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="485" y="146" font-size="15" font-weight="700" fill="#78350f" text-anchor="middle">axum API</text>
  <text x="485" y="168" font-size="13" fill="#44403c" text-anchor="middle">auth middleware &#183; handlers &#183; validation</text>

  <rect x="345" y="200" width="280" height="64" rx="10" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="485" y="226" font-size="15" font-weight="700" fill="#4c1d95" text-anchor="middle">Posting engine (repo.rs)</text>
  <text x="485" y="248" font-size="13" fill="#44403c" text-anchor="middle">idempotency &#183; ordered row locks &#183; overdraft</text>

  <rect x="345" y="280" width="280" height="64" rx="10" fill="#dcfce7" stroke="#16a34a"/>
  <text x="485" y="306" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">Webhook receiver</text>
  <text x="485" y="328" font-size="13" fill="#44403c" text-anchor="middle">secret path token &#183; store &#183; fast ack</text>

  <rect x="345" y="360" width="280" height="54" rx="10" fill="#fee2e2" stroke="#dc2626"/>
  <text x="485" y="384" font-size="15" font-weight="700" fill="#7f1d1d" text-anchor="middle">Background worker (tokio)</text>
  <text x="485" y="404" font-size="13" fill="#44403c" text-anchor="middle">callbacks w/ backoff &#183; reconciliation</text>

  <!-- DB -->
  <rect x="800" y="100" width="270" height="320" rx="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="935" y="132" font-size="18" font-weight="700" fill="#0c4a6e" text-anchor="middle">PostgreSQL 16</text>
  <g font-size="14" fill="#0f172a" font-family="Menlo,Consolas,monospace">
    <text x="830" y="170">accounts</text>
    <text x="830" y="196">transactions</text>
    <text x="830" y="222">entries (append-only)</text>
    <text x="830" y="248">payment_intents</text>
    <text x="830" y="274">mpesa_callbacks</text>
  </g>
  <rect x="822" y="300" width="226" height="96" rx="8" fill="#ffffff" stroke="#0284c7" stroke-dasharray="5 4"/>
  <text x="935" y="326" font-size="13" font-weight="700" fill="#0c4a6e" text-anchor="middle">Enforced in the database</text>
  <text x="935" y="348" font-size="12" fill="#334155" text-anchor="middle">debits = credits (deferred trigger)</text>
  <text x="935" y="366" font-size="12" fill="#334155" text-anchor="middle">no UPDATE/DELETE on ledger rows</text>
  <text x="935" y="384" font-size="12" fill="#334155" text-anchor="middle">UNIQUE idempotency_key</text>

  <!-- arrows -->
  <path d="M220,140 L345,152" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M220,340 L345,312" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M485,184 L485,200" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M625,232 L800,232" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M625,312 L800,290" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M625,388 L800,350" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)"/>

  <text x="712" y="222" font-size="12" fill="#475569" text-anchor="middle">SQL tx</text>
  <text x="712" y="310" font-size="12" fill="#475569" text-anchor="middle">store raw</text>
  <text x="712" y="385" font-size="12" fill="#475569" text-anchor="middle">SKIP LOCKED</text>

  <text x="550" y="500" font-size="14" fill="#475569" text-anchor="middle">Callbacks are acknowledged immediately and applied asynchronously, so Daraja never waits on the ledger.</text>
  <text x="550" y="524" font-size="14" fill="#475569" text-anchor="middle">The worker can be scaled to many instances: rows are claimed with FOR UPDATE SKIP LOCKED.</text>
</svg>
